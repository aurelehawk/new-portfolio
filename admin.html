<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Statistiques de Visites | Pascal Aurèle ELOUMOU</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-xl);
            background: var(--bg-secondary);
            min-height: 100vh;
        }
        
        .admin-header {
            background: var(--gradient-primary);
            color: white;
            padding: var(--space-xl);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-header h1 {
            color: white;
            margin: 0;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-md);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            transition: all var(--transition-base);
        }
        
        .back-btn:hover {
            background: white;
            color: var(--primary);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }
        
        .stat-card {
            background: var(--bg-primary);
            padding: var(--space-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: transform var(--transition-base);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: var(--font-weight-extrabold);
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: var(--space-xl);
            margin-bottom: var(--space-xl);
        }
        
        .chart-card {
            background: var(--bg-primary);
            padding: var(--space-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }
        
        .chart-card h2 {
            color: var(--primary);
            margin-bottom: var(--space-lg);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: var(--space-sm);
        }
        
        .chart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-sm);
            margin-bottom: var(--space-xs);
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
        }
        
        .chart-label {
            font-weight: var(--font-weight-medium);
            color: var(--text-primary);
        }
        
        .chart-bar {
            height: 8px;
            background: var(--gradient-primary);
            border-radius: var(--radius-full);
            margin-top: var(--space-xs);
        }
        
        .loading {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-secondary);
        }
        
        .no-data {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-secondary);
        }
        
        .refresh-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: var(--font-weight-semibold);
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            margin-top: var(--space-md);
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .admin-header {
                flex-direction: column;
                gap: var(--space-md);
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-chart-line"></i> Statistiques de Visites</h1>
            <div style="display: flex; gap: var(--space-sm);">
                <button onclick="AuthSystem.logout(); window.location.href='login.html';" class="back-btn" style="background: rgba(255, 0, 0, 0.1); border-color: rgba(255, 0, 0, 0.3);">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Retour au Portfolio
                </a>
            </div>
        </div>
        
        <div id="stats-container">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Chargement des statistiques...
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="analytics.js"></script>
    <script src="admin.js"></script>
    <script>
        // Vérifier l'authentification avant d'afficher le dashboard
        document.addEventListener('DOMContentLoaded', () => {
            if (!AuthSystem.requireAuth()) {
                // Redirection vers login si pas authentifié
                return;
            }
        });
    </script>
</body>
</html>
